name: Verify and deploy V16 player plus P7-B Forge inspector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7b-forge-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: V16 and Forge V2 analyzer candidate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Verify exact Forge V2 and protected Forge V1 plus V16 through V8
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < dist/sfhs-doom-forge-v2.html | tr -d ' ')" = '25852127'
          printf '%s  %s\n' '927d744c11c219dfbaffd8486f84cec77093cb626a35d389ad37d14aaf01326e' 'dist/sfhs-doom-forge-v2.html' | sha256sum --check --strict
          test "$(wc -c < dist/sfhs-doom-forge-v1.html | tr -d ' ')" = '25819800'
          printf '%s  %s\n' '9b4018515b416f6643058d85a04d7c49212f2ca664f50a9a1b3cc2d422d84754' 'dist/sfhs-doom-forge-v1.html' | sha256sum --check --strict
          test "$(wc -c < dist/sfhs-doom-android-sfhs-controls-v16.html | tr -d ' ')" = '48372561'
          printf '%s  %s\n' 'bc52a371427575c0c17ee8061c6d4db3d8a7120da116072f9b604f8b08863de2' 'dist/sfhs-doom-android-sfhs-controls-v16.html' | sha256sum --check --strict
          printf '%s  %s\n' 'e9a8b904d9fe91c09c15e6303757a4e2fd8d4eb05f8c1ce1f79c6c94ac8b71db' 'dist/sfhs-doom-android-sfhs-controls-v15.html' | sha256sum --check --strict
          printf '%s  %s\n' 'd3c72c6cd7fd26e96be2e4db324a03151194deea478b28776f486896519e2905' 'dist/sfhs-doom-android-sfhs-controls-v14.html' | sha256sum --check --strict
          printf '%s  %s\n' '97236f045b87b9f1fd65f9bcc9cc5d22ee0f348aaef8421b53987f6dc33abff9' 'dist/sfhs-doom-android-sfhs-controls-v13.html' | sha256sum --check --strict
          printf '%s  %s\n' '6b593fb3268b6fb1ca4cf5aa512c1f01e7c93ac51924964694e5ad712d7a7c24' 'dist/sfhs-doom-android-sfhs-controls-v12.html' | sha256sum --check --strict
          printf '%s  %s\n' 'fac2b1f0637f25bab7a5f41b42115ff955c8e1bef11234876c0871232301b973' 'dist/sfhs-doom-android-sfhs-controls-v11.html' | sha256sum --check --strict
          printf '%s  %s\n' '73a29b3ef179239744785a9b3e9b995fab77b82ab6c33452ae143d57a0b9e8f7' 'dist/sfhs-doom-android-sfhs-controls-v10.html' | sha256sum --check --strict
          printf '%s  %s\n' 'be885e63be73232d30bb0f897a319baa380231ea56e3eaebea64b29c71c05111' 'dist/sfhs-doom-android-sfhs-controls-v9.html' | sha256sum --check --strict
          printf '%s  %s\n' 'b806eb9274ae46954ecdc54968735ca1ca94f3f062e3559c54c59b0e7f6ad912' 'dist/sfhs-doom-android-sfhs-controls-v8.html' | sha256sum --check --strict
      - name: Validate the current single-file candidate
        run: |
          python tools/validate-p6-mobile.py dist/sfhs-doom-android-sfhs-controls-v16.html
          python tools/validate-forge-capsule.py dist/sfhs-doom-forge-v2.html --mode full --capsule-version 2
          python tools/validate-forge-capsule.py dist/sfhs-doom-forge-v1.html --mode full --capsule-version 1
          python -m unittest tests.test_p7_forge_contract -v
      - name: Install focused browser test dependencies
        working-directory: browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run P7-B, P7-A, and V16-focused browser gates
        working-directory: browser-tests
        run: npx playwright test p7b-local-analyzer p7a-forge-runtime p6-v16-weapon-cycle-repair --workers=1

  deploy-pages:
    name: Publish exact V16 player and Forge V2 inspector to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only exact V16 and Forge V2 bytes
        shell: bash
        run: |
          set -euo pipefail
          player_expected='bc52a371427575c0c17ee8061c6d4db3d8a7120da116072f9b604f8b08863de2'
          forge_expected='927d744c11c219dfbaffd8486f84cec77093cb626a35d389ad37d14aaf01326e'
          test "$(wc -c < dist/sfhs-doom-android-sfhs-controls-v16.html | tr -d ' ')" = '48372561'
          test "$(wc -c < dist/sfhs-doom-forge-v2.html | tr -d ' ')" = '25852127'
          printf '%s  %s\n' "$player_expected" 'dist/sfhs-doom-android-sfhs-controls-v16.html' | sha256sum --check --strict
          printf '%s  %s\n' "$forge_expected" 'dist/sfhs-doom-forge-v2.html' | sha256sum --check --strict
          mkdir -p _pages/forge
          cp dist/sfhs-doom-android-sfhs-controls-v16.html _pages/index.html
          cp dist/sfhs-doom-forge-v2.html _pages/forge/index.html
          : > _pages/.nojekyll
          printf '%s  %s\n' "$player_expected" '_pages/index.html' | sha256sum --check --strict
          printf '%s  %s\n' "$forge_expected" '_pages/forge/index.html' | sha256sum --check --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
