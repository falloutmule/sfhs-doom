name: Verify and deploy P6 Samsung LOOK candidate v5

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Focused P6 candidate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Verify exact selected Samsung V5 artifact identity
        shell: bash
        run: |
          test "$(wc -c < dist/sfhs-doom-android-samsung-input-v5.html | tr -d ' ')" = '48327803'
          printf '%s  %s\n' 'fa78944cd1482770dde9fde2192022b07991ca1942359de97d7557dc79333b7e' 'dist/sfhs-doom-android-samsung-input-v5.html' | sha256sum --check --strict
          test "$(wc -c < dist/sfhs-doom-android-samsung-input-v4.html | tr -d ' ')" = '48323709'
          printf '%s  %s\n' 'dff29abb293d0f373a696393537a2c2f88a8f116c751b2eff3cc9ebc8908b640' 'dist/sfhs-doom-android-samsung-input-v4.html' | sha256sum --check --strict
          test "$(wc -c < dist/sfhs-doom-android.html | tr -d ' ')" = '48275694'
          printf '%s  %s\n' 'fb357e4276a019832a30ba0719a26b5ad815c7accb45ff46be8b302c7406c171' 'dist/sfhs-doom-android.html' | sha256sum --check --strict
          test "$(wc -c < dist/sfhs-doom-freedoom2.html | tr -d ' ')" = '48225654'
          printf '%s  %s\n' '6737dbfc8c7909ea18a820de3cd6677654fab95277caf05eb9d660cb9235490e' 'dist/sfhs-doom-freedoom2.html' | sha256sum --check --strict
      - name: Run focused static and state-contract checks
        run: |
          python tools/validate-p6-mobile.py dist/sfhs-doom-android-samsung-input-v5.html
          python -m unittest tests.test_p6_mobile_contract tests.test_artifact_manifest
          python tools/validate_artifact_manifest.py evidence/manifests/P06/sfhs-doom-android-samsung-input-v5.json
          python tools/validate_project_docs.py
          python tools/taskctl.py validate
      - name: Install focused browser test dependencies
        working-directory: browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run focused browser checks
        working-directory: browser-tests
        run: npx playwright test tests/p6-layout.spec.mjs tests/p6-candidate.spec.mjs tests/p6-samsung-input-v3.spec.mjs tests/p6-samsung-input-v4.spec.mjs tests/p6-samsung-input-v5.spec.mjs --workers=1

  deploy-pages:
    name: Publish exact candidate to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only exact Samsung V5 candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          expected='fa78944cd1482770dde9fde2192022b07991ca1942359de97d7557dc79333b7e'
          test "$(wc -c < dist/sfhs-doom-android-samsung-input-v5.html | tr -d ' ')" = '48327803'
          printf '%s  %s\n' "$expected" 'dist/sfhs-doom-android-samsung-input-v5.html' | sha256sum --check --strict
          mkdir -p _pages
          cp dist/sfhs-doom-android-samsung-input-v5.html _pages/index.html
          : > _pages/.nojekyll
          printf '%s  %s\n' "$expected" '_pages/index.html' | sha256sum --check --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
