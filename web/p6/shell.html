<body>

      const showDiagnostic=()=>{clearLookTapFire('diagnostics-open');controller.releaseAll('diagnostics-open');closeUtilities();document.body.dataset.sfhsSettingsOpen='true';diagnosticOutput.textContent=JSON.stringify(window.SFHSDoomMobileControls.snapshot(),null,2);diagnostic.classList.add('is-open');document.getElementById('diagnostics-close').focus();};
      document.getElementById('diagnostics-toggle').addEventListener('click',showDiagnostic);document.getElementById('diagnostics-close').addEventListener('click',()=>{diagnostic.classList.remove('is-open');document.body.dataset.sfhsSettingsOpen='false';settingsToggle.focus();});
      document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(panelEdit.lifecycle==='editing')cancelPanelEdit('escape');else if(controller.read().lifecycle==='editing')closeEditor(true);else if(diagnostic.classList.contains('is-open')){diagnostic.classList.remove('is-open');document.body.dataset.sfhsSettingsOpen='false';settingsToggle.focus();}else if(utility.classList.contains('is-open'))closeUtilities(true);});
      window.addEventListener('blur',event=>{if(event.target===window&&panelEdit.lifecycle==='editing')cancelPanelEdit('blur');},true);window.addEventListener('pagehide',()=>{if(panelEdit.lifecycle==='editing')cancelPanelEdit('pagehide');},true);document.addEventListener('visibilitychange',()=>{if(document.hidden&&panelEdit.lifecycle==='editing')cancelPanelEdit('visibility-hidden');},true);

      const fullscreenAction=document.getElementById('fullscreen-action');
      function syncFullscreen(){state.fullscreen.active=document.fullscreenElement===appRoot;state.fullscreen.changes+=1;fullscreenAction.textContent=state.fullscreen.active?'Fullscreen active':'Enter Fullscreen';utilityStatus.textContent=state.fullscreen.rejected?'Fullscreen request was rejected; Doom continues normally.':(state.fullscreen.active?'Fullscreen is active.':'Windowed browser mode is active.');}
      function requestAppFullscreen(){state.fullscreen.supported=typeof appRoot.requestFullscreen==='function';if(!state.fullscreen.supported){utilityStatus.textContent='Fullscreen API is unavailable; Doom continues normally.';return null;}state.fullscreen.requested=true;state.fullscreen.rejected=false;state.fullscreen.error=null;try{const pending=appRoot.requestFullscreen();if(pending&&typeof pending.catch==='function')pending.catch(error=>{state.fullscreen.rejected=true;state.fullscreen.error=String(error);state.errors.push('fullscreen:'+String(error));syncFullscreen();});return pending;}catch(error){state.fullscreen.rejected=true;state.fullscreen.error=String(error);state.errors.push('fullscreen:'+String(error));syncFullscreen();return null;}}
      document.addEventListener('fullscreenchange',syncFullscreen);
      fullscreenAction.addEventListener('click',requestAppFullscreen);

      const worldCanvas=document.getElementById('canvas'),gameRegion=document.getElementById('game-region');
      function syncWorldScale(){const box=gameRegion.getBoundingClientRect(),portrait=matchMedia('(orientation:portrait)').matches;let width=box.width,height=box.height;if(!portrait){if(width*5>height*8)width=height*8/5;else height=width*5/8;}worldCanvas.style.setProperty('--world-scale-x',String(width/320));worldCanvas.style.setProperty('--world-scale-y',String(height/200));}
      function syncViewport(){const visualHeight=window.visualViewport?window.visualViewport.height:window.innerHeight,height=Math.min(window.innerHeight,visualHeight),orientation=currentOrientation();if(panelEdit.lifecycle==='editing'&&orientation!==panelEdit.orientation)cancelPanelEdit('orientation-change');appRoot.style.setProperty('--vvh',`${Math.round(height)}px`);applyPanelLayout(panelEdit.lifecycle==='editing'?panelEdit.draft:uiPreferences);syncWorldScale();}
      window.addEventListener('resize',syncViewport,{passive:true});
      window.addEventListener('orientationchange',syncViewport,{passive:true});
      if(window.visualViewport)window.visualViewport.addEventListener('resize',syncViewport,{passive:true});
      syncViewport();

      const query=new URLSearchParams(location.search),oracle=query.get('oracle')==='1',audio=query.get('audio')!=='0';state.oracle=oracle;
      const mobileExtraConfig='/sfhs-doom-mobile-extra.cfg',mobileExtraConfigText='key_prevweapon 51\nkey_nextweapon 52\n';
      const baseArgs=['-iwad','freedoom2.wad','-warp','1','1','-skill','3','-window','-width','320','-height','200','-nograbmouse','-extraconfig',mobileExtraConfig];
      const args=oracle?[...baseArgs,'-nomusic']:[...baseArgs,...(audio?['-nomusic']:['-nosound','-nomusic'])];
      window.SFHS_P3_MODULE_CONFIG={canvas:document.getElementById('canvas'),arguments:args,noInitialRun:true,ENV:oracle?{SFHS_ORACLE_OUTPUT:'/oracle-output'}:undefined,print:value=>console.log(String(value)),printErr:value=>{state.lastEngineDiagnostic=String(value);if(state.lastEngineDiagnostic.startsWith('emscripten_set_main_loop_timing: Cannot set timing mode'))console.warn(state.lastEngineDiagnostic);else console.error(state.lastEngineDiagnostic);},onAbort:value=>state.errors.push('abort:'+String(value)),onRuntimeInitialized:()=>{try{window.Module.FS.writeFile(mobileExtraConfig,mobileExtraConfigText);state.weaponCycleConfig='ready';}catch(error){state.weaponCycleConfig='failed';state.errors.push('weapon-cycle-config:'+String(error));return;}document.body.dataset.sfhsP6Runtime='ready';document.getElementById('start-doom').hidden=false;document.getElementById('setup-status').textContent='Ready - tap Start Fullscreen';}};
      window.SFHS_P3_MODULE=window.SFHS_P3_MODULE_CONFIG;
      const start=document.getElementById('start-doom'),renderer=document.getElementById('renderer-mode'),setup=document.getElementById('setup-overlay');
      start.addEventListener('click',()=>{if(state.mainStarted)return;requestAppFullscreen();const configure=window.Module&&window.Module._sfhs_mobile_present_configure_renderer;if(typeof configure!=='function'){state.errors.push('required runtime export unavailable');return;}if(configure(renderer.value==='compatibility'?1:0)<0){state.errors.push('renderer configuration rejected');return;}state.mainStarted=true;state.mainInvocations+=1;document.body.dataset.sfhsP6Main='started';setup.hidden=true;settingsToggle.hidden=false;const run=window.Module.callMain(window.Module.arguments);document.body.dataset.sfhsP6Presentation='active';state.presentationUpdates+=1;if(run&&typeof run.catch==='function')run.catch(error=>state.errors.push(String(error)));document.getElementById('canvas').focus();});
      window.SFHS_WASM_TEST=Object.freeze({mobileControlsSnapshot:()=>controller.read(),flushMobileControls:()=>{flushForDoomTic();return window.SFHSDoomMobileControls.snapshot();},setMobileControlsProfile:value=>controller.importProfile(value),mobileControlsProfile:()=>controller.exportProfile(),controlRect:id=>document.querySelector('[data-sfhs-control-id="'+id+'"]').getBoundingClientRect(),adapterSnapshot:()=>window.SFHSDoomMobileControls.snapshot(),mobileUiSnapshot:()=>uiPreferenceSnapshot(),nativeHudSnapshot:hudSnapshot,presentationSnapshot,fullscreenState:()=>structuredClone(state.fullscreen),readOracleState:()=>{try{return window.Module.FS.readFile('/oracle-output/state.jsonl',{encoding:'utf8'});}catch(_){return '';}}});
    })();
    </script>
    <script>var Module = window.SFHS_P3_MODULE_CONFIG;</script>
    <script>
    (()=>{'use strict';
      const minimap=document.getElementById('minimap-canvas'),minimapContext=minimap.getContext('2d'),placeholder=document.getElementById('minimap-placeholder');
      const statusCanvas=document.getElementById('doom-status-canvas'),statusContext=statusCanvas.getContext('2d',{alpha:true});statusContext.imageSmoothingEnabled=false;
      const image=statusContext.createImageData(320,32);let minimapTimer=null,hudFrame=null,lastHudUpdate=-1,lastHudActive=false;
      function updateMinimap(){if(document.hidden||document.body.dataset.sfhsP6Editing==='true'||!window.Module||!window.Module.HEAP32||typeof window.Module._sfhs_mobile_state_snapshot!=='function')return;const pointer=window.Module._sfhs_mobile_state_snapshot();if(!pointer)return;const heap=window.Module.HEAP32,base=pointer>>2,values=[];for(let i=0;i<14;i+=1)values.push(heap[base+i]);if(values[0]!==1||!values[1])return;const lines=window.Module._sfhs_mobile_state_lines(),count=Math.min(values[13],4096),playerX=values[4]/65536,playerY=values[5]/65536,points=[];for(let i=0;i<count;i+=1){const at=(lines>>2)+i*5;points.push([heap[at]/65536,heap[at+1]/65536,heap[at+2]/65536,heap[at+3]/65536]);}let lowX=playerX-64,highX=playerX+64,lowY=playerY-64,highY=playerY+64;for(const line of points){lowX=Math.min(lowX,line[0],line[2]);highX=Math.max(highX,line[0],line[2]);lowY=Math.min(lowY,line[1],line[3]);highY=Math.max(highY,line[1],line[3]);}const scale=Math.min((minimap.width-12)/(highX-lowX||1),(minimap.height-12)/(highY-lowY||1)),x=value=>6+(value-lowX)*scale,y=value=>minimap.height-6-(value-lowY)*scale;minimapContext.fillStyle='#0b151d';minimapContext.fillRect(0,0,minimap.width,minimap.height);minimapContext.strokeStyle='#89abc2';minimapContext.beginPath();for(const line of points){minimapContext.moveTo(x(line[0]),y(line[1]));minimapContext.lineTo(x(line[2]),y(line[3]));}minimapContext.stroke();minimapContext.fillStyle='#f4c27e';minimapContext.beginPath();minimapContext.arc(x(playerX),y(playerY),3,0,Math.PI*2);minimapContext.fill();window.SFHS_P6_STATE.minimapUpdates+=1;placeholder.hidden=true;}
      function readHud(){return window.SFHS_WASM_TEST&&window.SFHS_WASM_TEST.nativeHudSnapshot();}
      function drawHud(){hudFrame=null;window.SFHS_P6_STATE.hudRafCallbacks+=1;if(document.hidden){window.SFHS_P6_STATE.hudLoopSuspended=true;return;}window.SFHS_P6_STATE.hudLoopSuspended=false;const snapshot=readHud();if(snapshot&&snapshot.active&&snapshot.width===320&&snapshot.height===32&&window.Module&&window.Module.HEAPU8){if(snapshot.updateCount!==lastHudUpdate){const pointer=window.Module._sfhs_mobile_hud_pixels();image.data.set(window.Module.HEAPU8.subarray(pointer,pointer+snapshot.rgbaPitch*snapshot.height));statusContext.putImageData(image,0,0);statusCanvas.dataset.active='true';window.SFHS_P6_STATE.hudDraws+=1;lastHudUpdate=snapshot.updateCount;lastHudActive=true;}}else if(lastHudActive){statusContext.clearRect(0,0,320,32);statusCanvas.dataset.active='false';window.SFHS_P6_STATE.hudClears+=1;lastHudActive=false;lastHudUpdate=snapshot?snapshot.updateCount:-1;}hudFrame=requestAnimationFrame(drawHud);}
      function sync(){if(minimapTimer!==null)clearInterval(minimapTimer);minimapTimer=document.hidden?null:setInterval(updateMinimap,100);if(document.hidden){if(hudFrame!==null)cancelAnimationFrame(hudFrame);hudFrame=null;window.SFHS_P6_STATE.hudLoopSuspended=true;}else if(hudFrame===null){hudFrame=requestAnimationFrame(drawHud);}}
      document.addEventListener('visibilitychange',sync);window.addEventListener('pagehide',()=>{if(minimapTimer!==null)clearInterval(minimapTimer);minimapTimer=null;if(hudFrame!==null)cancelAnimationFrame(hudFrame);hudFrame=null;});sync();
    })();
    </script>
